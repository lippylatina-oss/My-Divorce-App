<style>
:root {
  --color-bg: #f5f5f7;
  --color-surface: #ffffff;

  --color-border: #e2e2e6;

  --color-dad: #1864ab;
  --badge-mom-bg: #fbe0ea;
  --badge-dad-bg: #dceaf9;
  --color-incidents: #e8590c;
  --color-finance: #2f9e44;
  --color-camper: #1098ad;
  --color-shop: #f59f00;

  --nav-height: 64px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-bg: #0f0f12;
    --color-surface: #1c1c1f;
    --color-text: #f2f2f3;
    --color-text-secondary: #9a9aa0;
    --color-border: #2e2e33;
    --badge-mom-bg: #4a1530;
    --badge-dad-bg: #0f2c47;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--color-bg);
  color: var(--color-text);

}
button, input, textarea, select { font-family: inherit; color: inherit; }
a { color: inherit; }
#app { max-width: 480px; margin: 0 auto; padding: 20px 16px 24px; }

.screen-header h1 { font-size: 22px; margin: 8px 0 16px; }
.screen-header--form { display: flex; align-items: center; gap: 4px; }
.screen-header--form h1 { margin: 0; font-size: 20px; }
.btn-icon { background: none; border: none; font-size: 22px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--color-primary); cursor: pointer; }
.logged-caption { margin: -8px 0 16px; font-size: 12px; color: var(--color-text-secondary); }

.filter-bar { background: var(--color-surface); border-radius: var(--radius); padding: 12px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.filter-row { display: flex; gap: 10px; }

.filter-row--actions { justify-content: space-between; }
.filter-field { flex: 1; display: flex; flex-direction: column; font-size: 12px; color: var(--color-text-secondary); gap: 4px; }
.filter-field input { padding: 10px; border: 1px solid var(--color-border); border-radius: 10px; font-size: 15px; background: var(--color-bg); color: var(--color-text); min-height: 44px; }

.list { display: flex; flex-direction: column; gap: 10px; }

.badge-dad { background: var(--badge-dad-bg); color: var(--color-dad); }

.history-panel { margin-top: 16px; background: var(--color-surface); border-radius: var(--radius); padding: 12px 16px; }

.log-card-icon { color: var(--log-color, var(--color-primary)); display: flex; flex: none; }

.attachment-name { font-size: 11px; color: var(--color-text-secondary); text-align: center; max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attachment-remove { position: absolute; top: -6px; right: -2px; width: 22px; height: 22px; border-radius: 50%; background: var(--color-danger); color: #fff; border: 2px solid var(--color-surface); font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }

.bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--nav-height) + var(--safe-bottom)); padding-bottom: var(--safe-bottom); background: var(--color-surface); border-top: 1px solid var(--color-border); display: flex; justify-content: space-around; align-items: center; max-width: 480px; margin: 0 auto; z-index: 30; }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: var(--color-text-secondary); font-size: 11px; flex: 1; padding: 6px 0; min-height: 48px; justify-content: center; }
.nav-item.is-active { color: var(--color-primary); }

.toast { position: fixed; left: 50%; bottom: calc(var(--nav-height) + var(--safe-bottom) + 20px); transform: translate(-50%, 10px); background: #1c1c1e; color: #fff; padding: 10px 18px; border-radius: 100px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 100; }
.modal { background: var(--color-surface); border-radius: 18px 18px 0 0; padding: 22px 20px calc(22px + var(--safe-bottom)); width: 100%; max-width: 480px; }
@media (min-width: 520px) { .modal-overlay { align-items: center; } .modal { border-radius: 18px; } }
.modal h2 { margin: 0 0 8px; font-size: 18px; }
.modal p { margin: 0 0 18px; color: var(--color-text-secondary); font-size: 14px; }
.modal-actions { display: flex; gap: 10px; }

<script>
"use strict";

/* =========================================================================
   My Divorce App
   Single-file mobile-first log tracker. Data lives entirely in this
   browser's IndexedDB (local to the device). Currently implements:
     - Incident Log
     - Parenting Time Log (with automatic hours/%/overnight calculations)
     - Finance Log (with running totals by month and date range)
     - At Camper Log / At Shop Log (simple date+time entries)
     - Court Docs Filed Log (with optional photo/PDF attachments)
   All six logs are reached through the Logs hub (#/logs) rather than the
   bottom nav directly, since six items won't fit a mobile tab bar. New
   logs should follow the same pattern: an object store, a render*List
   function, a render*Form function, a submit*Form function, and an entry
   in LOG_CONFIG.
   Not yet built: Day View, Calendar View, search/filter within a log,
   PDF/CSV export, and CSV import (these are the next phase).
   ========================================================================= */

/* ---------------------------- DB layer ---------------------------- */

const DB_NAME = "myDivorceAppDB";
const DB_VERSION = 2;
let db;

function openDatabase() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const _db = e.target.result;
      if (!_db.objectStoreNames.contains("incidents")) {
        const s = _db.createObjectStore("incidents", { keyPath: "id", autoIncrement: true });
        s.createIndex("date", "date");
      }
      if (!_db.objectStoreNames.contains("parentingTime")) {
        const s = _db.createObjectStore("parentingTime", { keyPath: "id", autoIncrement: true });
        s.createIndex("startDate", "startDate");
      }
      if (!_db.objectStoreNames.contains("finance")) {
        const s = _db.createObjectStore("finance", { keyPath: "id", autoIncrement: true });
        s.createIndex("date", "date");
      }
      if (!_db.objectStoreNames.contains("camper")) {
        const s = _db.createObjectStore("camper", { keyPath: "id", autoIncrement: true });
        s.createIndex("date", "date");
      }
      if (!_db.objectStoreNames.contains("shop")) {
        const s = _db.createObjectStore("shop", { keyPath: "id", autoIncrement: true });
        s.createIndex("date", "date");
      }
      if (!_db.objectStoreNames.contains("courtdocs")) {
        const s = _db.createObjectStore("courtdocs", { keyPath: "id", autoIncrement: true });
        s.createIndex("dateFiled", "dateFiled");
      }
      if (!_db.objectStoreNames.contains("settings")) {
        _db.createObjectStore("settings", { keyPath: "key" });
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e.target.error);
  });
}

function txStore(name, mode) {
  return db.transaction(name, mode || "readonly").objectStore(name);
}
function dbGetAll(name) {
  return new Promise((resolve, reject) => {
    const req = txStore(name).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function dbGet(name, id) {
  return new Promise((resolve, reject) => {
    const req = txStore(name).get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function dbPut(name, obj) {
  return new Promise((resolve, reject) => {
    const req = txStore(name, "readwrite").put(obj);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

/* ---------------------------- Settings ---------------------------- */

let cachedSettings = null;

async function loadSettings() {
  if (cachedSettings) return cachedSettings;
  let s = await dbGet("settings", "settings");
  if (!s) {
    s = { key: "settings", overnightStart: "00:00", overnightEnd: "06:00" };
    await dbPut("settings", s);
  }
  cachedSettings = s;
  return s;
}

/* ---------------------------- Date / format helpers ---------------------------- */

function pad(n) { return String(n).padStart(2, "0"); }
function todayISO() { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function nowTimeHHMM() { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function nowISO() { return new Date().toISOString(); }
function parseDT(dateStr, timeStr) { return new Date(dateStr + "T" + (timeStr || "00:00") + ":00"); }
function fmtDate(dateStr) {
  return parseDT(dateStr, "00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}
function fmtTime(timeStr) {
  const [h, m] = timeStr.split(":").map(Number);
  const d = new Date(); d.setHours(h, m, 0, 0);
  return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}
function fmtDateTime(dateStr, timeStr) { return fmtDate(dateStr) + ", " + fmtTime(timeStr); }
function fmtTimestamp(iso) { return new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }); }
function fmtMoney(n) { return "$" + (Number(n) || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function escapeHtml(str) {
  return String(str == null ? "" : str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function truncate(str, n) { return str && str.length > n ? str.slice(0, n - 1) + "…" : (str || ""); }

function diffFields(oldObj, newObj, fields) {
  const changes = {};
  fields.forEach((f) => {
    const ov = oldObj ? oldObj[f] : undefined;
    const nv = newObj[f];
    if (JSON.stringify(ov) !== JSON.stringify(nv)) changes[f] = { old: ov, new: nv };
  });
  return changes;
}

const FIELD_LABELS = {
  date: "Date", time: "Time", kidsPresent: "Kids present", description: "Description",
  startDate: "Start date", startTime: "Start time", endDate: "End date", endTime: "End time", parent: "Parent",
  amountPaid: "Amount paid", amountSupport: "Support payment amount",
  dateFiled: "Date filed", documentName: "Document name", attachments: "Attachments"
};
function fieldLabel(f) { return FIELD_LABELS[f] || f; }
function fmtVal(f, v) {
  if (v === undefined) return "—";
  if (f === "kidsPresent") return v ? "Yes" : "No";
  if (f === "amountPaid" || f === "amountSupport") return fmtMoney(v);
  if (v === "") return "(empty)";
  return String(v);
}

function historyHtml(history) {
  if (!history || !history.length) return "";
  const items = [...history].reverse().map((h) => {
    let desc;
    if (h.action === "created") desc = "Entry created";
    else if (h.action === "deleted") desc = "Entry deleted";
    else if (h.action === "restored") desc = "Entry restored";
    else {
      const parts = Object.entries(h.changes || {}).map(([f, c]) => `${fieldLabel(f)}: "${fmtVal(f, c.old)}" → "${fmtVal(f, c.new)}"`);
      desc = parts.length ? parts.join("; ") : "Entry edited";
    }
    return `<li><span class="history-time">${fmtTimestamp(h.ts)}</span><span class="history-desc">${escapeHtml(desc)}</span></li>`;

/* ---------------------------- Overnight / summary math ---------------------------- */

function countOvernightsForEntry(entry, settings, rangeStartDate, rangeEndDate) {
  const [sh, sm] = settings.overnightStart.split(":").map(Number);
  const [eh, em] = settings.overnightEnd.split(":").map(Number);
  const crossesMidnight = (eh < sh) || (eh === sh && em <= sm);
  let count = 0;
  let d = new Date(entry.startDT.getFullYear(), entry.startDT.getMonth(), entry.startDT.getDate());
  d.setDate(d.getDate() - 1);
  const endBound = new Date(entry.endDT.getFullYear(), entry.endDT.getMonth(), entry.endDT.getDate());
  endBound.setDate(endBound.getDate() + 1);
  while (d <= endBound) {
    const wStart = new Date(d); wStart.setHours(sh, sm, 0, 0);
    const wEnd = new Date(d); if (crossesMidnight) wEnd.setDate(wEnd.getDate() + 1); wEnd.setHours(eh, em, 0, 0);
    if (entry.startDT.getTime() <= wStart.getTime() && entry.endDT.getTime() >= wEnd.getTime()) {
      const inRange = (!rangeStartDate || d.getTime() >= rangeStartDate.getTime()) && (!rangeEndDate || d.getTime() <= rangeEndDate.getTime());
      if (inRange) count++;
    }
    d.setDate(d.getDate() + 1);
  }
  return count;
}

function computeSummary(entries, settings, rangeStart, rangeEnd) {
  const result = { Mom: { hours: 0, overnights: 0 }, Dad: { hours: 0, overnights: 0 } };
  const rangeStartDateOnly = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate());
  const rangeEndDateOnly = new Date(rangeEnd.getFullYear(), rangeEnd.getMonth(), rangeEnd.getDate());
  const lastIncludedDate = new Date(rangeEndDateOnly); lastIncludedDate.setDate(lastIncludedDate.getDate() - 1);
  entries.filter((e) => !e.deleted).forEach((e) => {
    const startDT = parseDT(e.startDate, e.startTime);
    const endDT = parseDT(e.endDate, e.endTime);
    const overlapMs = Math.min(endDT.getTime(), rangeEnd.getTime()) - Math.max(startDT.getTime(), rangeStart.getTime());
    if (overlapMs > 0) result[e.parent].hours += overlapMs / 3600000;
    result[e.parent].overnights += countOvernightsForEntry({ startDT, endDT }, settings, rangeStartDateOnly, lastIncludedDate);
  });
  return result;
}

function getPresetRange(preset, customFrom, customTo) {
  const now = new Date();
  let start, end;
  if (preset === "month") {
    start = new Date(now.getFullYear(), now.getMonth(), 1);
    end = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  } else if (preset === "3months") {
    start = new Date(now.getFullYear(), now.getMonth() - 2, 1);
    end = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  } else if (preset === "year") {
    start = new Date(now.getFullYear(), 0, 1);
    end = new Date(now.getFullYear() + 1, 0, 1);
  } else {
    start = customFrom ? parseDT(customFrom, "00:00") : new Date(now.getFullYear(), now.getMonth(), 1);
    end = customTo ? (() => { const d = parseDT(customTo, "00:00"); d.setDate(d.getDate() + 1); return d; })() : new Date(now.getFullYear(), now.getMonth() + 1, 1);
  }
  return { start, end };
}

function incidentInRange(e, filter) {
  if (filter.from && e.date < filter.from) return false;
  if (filter.to && e.date > filter.to) return false;
  return true;
}
function parentingInRange(e, filter) {
  if (!filter.from && !filter.to) return true;
  const from = filter.from || "0000-01-01";
  const to = filter.to || "9999-12-31";
  return e.startDate <= to && e.endDate >= from;
}
function dateInRange(e, filter, field) {
  field = field || "date";
  if (filter.from && e[field] < filter.from) return false;
  if (filter.to && e[field] > filter.to) return false;
  return true;
}
function getFilterObj(scope) {
  if (scope === "incidents") return incidentFilter;
  if (scope === "parenting") return parentingFilter;
  return logFilters[scope] || null;
}

function computeFinanceTotals(entries) {
  const overall = { paid: 0, support: 0 };
  const byMonthMap = {};
  entries.forEach((e) => {
    overall.paid += Number(e.amountPaid) || 0;
    overall.support += Number(e.amountSupport) || 0;
    const monthKey = e.date.slice(0, 7);
    if (!byMonthMap[monthKey]) byMonthMap[monthKey] = { paid: 0, support: 0 };
    byMonthMap[monthKey].paid += Number(e.amountPaid) || 0;
    byMonthMap[monthKey].support += Number(e.amountSupport) || 0;
  });
  const byMonth = Object.keys(byMonthMap).sort().reverse().map((k) => ({
    monthKey: k,
    label: new Date(k + "-01T00:00:00").toLocaleDateString(undefined, { month: "long", year: "numeric" }),
    paid: byMonthMap[k].paid,
    support: byMonthMap[k].support
  }));
  return { overall, byMonth };
}

async function blobToBase64(blob) {
  const buf = await blob.arrayBuffer();
  const bytes = new Uint8Array(buf);
  let binary = "";
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(binary);
}
function base64ToBlob(base64, type) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type });
}

function presetTabHtml(value, label) {
  return `<button type="button" class="preset-tab ${summaryState.preset === value ? "is-active" : ""}" data-action="set-summary-preset" data-preset="${value}">${label}</button>`;
}
function fmtRangeCaption(start, end) {
  const lastDay = new Date(end); lastDay.setDate(lastDay.getDate() - 1);
  const opts = { month: "short", day: "numeric", year: "numeric" };
  return `${start.toLocaleDateString(undefined, opts)} – ${lastDay.toLocaleDateString(undefined, opts)}`;
}
function barRowHtml(label, value, max, cls, unit) {
  const pct = max > 0 ? Math.min(100, (value / max) * 100) : 0;
  const display = Number.isInteger(value) ? value : value.toFixed(1);
  return `
  <div class="bar-row">
    <span class="bar-label">${label}</span>
    <div class="bar-track"><div class="bar-fill bar-fill--${cls}" style="width:${pct}%"></div></div>
    <span class="bar-value">${display}${unit}</span>
  </div>`;
}
function donutChartSvg(momPct, dadPct) {
  const size = 160, stroke = 22, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const total = momPct + dadPct;
  if (total <= 0) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="donut">
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--color-border)" stroke-width="${stroke}"/>
      <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" class="donut-center">0%</text>
    </svg>`;
  }
  const momLen = c * (momPct / 100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="donut">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--color-border)" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--color-mom)" stroke-width="${stroke}" stroke-dasharray="${momLen} ${c - momLen}" stroke-dashoffset="0" transform="rotate(-90 ${size / 2} ${size / 2})"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--color-dad)" stroke-width="${stroke}" stroke-dasharray="${c - momLen} ${momLen}" stroke-dashoffset="${-momLen}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" class="donut-center">${momPct.toFixed(0)}/${dadPct.toFixed(0)}</text>
  </svg>`;
}

/* ---------------------------- Toast + modal ---------------------------- */

let toastTimer;
function showToast(msg) {
  let toast = document.getElementById("toast");
  if (!toast) {
    toast = document.createElement("div");
    toast.id = "toast";
    toast.className = "toast";
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2000);
}

function confirmModal(title, msg, onConfirm, confirmLabel) {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal">
      <h2>${escapeHtml(title)}</h2>
      <p>${escapeHtml(msg)}</p>
      <div class="modal-actions">
        <button class="btn-secondary" data-modal="cancel">Cancel</button>
        <button class="btn-danger" data-modal="confirm">${escapeHtml(confirmLabel || "Delete")}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay || e.target.dataset.modal === "cancel") { overlay.remove(); }
    else if (e.target.dataset.modal === "confirm") { overlay.remove(); onConfirm(); }
  });
}

}

async function render() {
  const parts = currentRouteParts();
  const root = parts[0] || "incidents";
  updateNavActive(root);
  const app = document.getElementById("app");
  window.scrollTo(0, 0);
  try {
    if (root === "incidents") {
      if (parts[1] === "new") app.innerHTML = await renderIncidentForm();
      else if (parts[1] === "edit") app.innerHTML = await renderIncidentForm(Number(parts[2]));
      else app.innerHTML = await renderIncidentList();
    } else if (root === "parenting") {
      if (parts[1] === "new") app.innerHTML = await renderParentingForm();
      else if (parts[1] === "edit") app.innerHTML = await renderParentingForm(Number(parts[2]));
      else app.innerHTML = await renderParentingList();
    } else if (root === "logs") {
      app.innerHTML = await renderLogsHub();
    } else if (root === "finance") {
      if (parts[1] === "new") app.innerHTML = await renderFinanceForm();
      else if (parts[1] === "edit") app.innerHTML = await renderFinanceForm(Number(parts[2]));
      else app.innerHTML = await renderFinanceList();
    } else if (root === "camper") {
      if (parts[1] === "new") app.innerHTML = await camperLog.renderForm();
      else if (parts[1] === "edit") app.innerHTML = await camperLog.renderForm(Number(parts[2]));
      else app.innerHTML = await camperLog.renderList();
    } else if (root === "shop") {
      if (parts[1] === "new") app.innerHTML = await shopLog.renderForm();
      else if (parts[1] === "edit") app.innerHTML = await shopLog.renderForm(Number(parts[2]));
      else app.innerHTML = await shopLog.renderList();
    } else if (root === "courtdocs") {
      if (parts[1] === "new") { app.innerHTML = await renderCourtDocsForm(); renderAttachmentChips(); }
      else if (parts[1] === "edit") { app.innerHTML = await renderCourtDocsForm(Number(parts[2])); renderAttachmentChips(); }
      else app.innerHTML = await renderCourtDocsList();
    } else if (root === "summary") {
      app.innerHTML = await renderSummary();
    } else if (root === "settings") {
      app.innerHTML = await renderSettings();
    } else {
      location.hash = "#/logs";
    }
  } catch (err) {
    console.error(err);
    app.innerHTML = `<div class="empty-state"><p>Something went wrong loading this screen.</p><p>${escapeHtml(err.message)}</p></div>`;
  }
}

/* ---------------------------- Event delegation ---------------------------- */

async function onAppClick(e) {
  const seg = e.target.closest(".segmented-option");
  if (seg) {
    const wrap = seg.closest(".segmented");
    wrap.querySelectorAll(".segmented-option").forEach((b) => b.classList.remove("is-active"));
    seg.classList.add("is-active");
    const hidden = wrap.parentElement.querySelector(`input[type="hidden"][name="${wrap.dataset.name}"]`);
    if (hidden) hidden.value = seg.dataset.value;
    return;
  }

  const actionEl = e.target.closest("[data-action]");
  if (!actionEl) return;
  const action = actionEl.dataset.action;

  if (action === "nav") { location.hash = actionEl.dataset.href; return; }

  if (action === "set-summary-preset") { summaryState.preset = actionEl.dataset.preset; render(); return; }

  if (action === "clear-filter") {
    const obj = getFilterObj(actionEl.dataset.prefix);
    if (obj) { obj.from = null; obj.to = null; obj.showDeleted = false; }
    render();
    return;
  }

  if (action === "export-data") { await exportData(); return; }
  if (action === "import-data") { document.getElementById("import-file").click(); return; }

  if (action === "add-attachment") { document.getElementById("courtdocs-file-input").click(); return; }
  if (action === "remove-attachment") {
    const idx = Number(actionEl.dataset.idx);
    courtDocsPendingAttachments.splice(idx, 1);
    renderAttachmentChips();
    return;
  }
  if (action === "open-attachment") {
    const idx = Number(actionEl.dataset.idx);
    const item = courtDocsPendingAttachments[idx];
    if (item) window.open(URL.createObjectURL(item.blob), "_blank");
    return;
  }

  if (action === "delete-entry" || action === "restore-entry") {
    const store = actionEl.dataset.store;
    const routePrefix = actionEl.dataset.route;
    const id = Number(actionEl.dataset.id);
    if (action === "delete-entry") {
      confirmModal("Delete this entry?", "It will be hidden from the log but kept on record so you can restore it later.", async () => {
        const existing = await dbGet(store, id);
        existing.history = existing.history || [];
        existing.deleted = true;
        existing.deletedAt = nowISO();
        existing.history.push({ ts: nowISO(), action: "deleted", changes: {} });
        await dbPut(store, existing);
        showToast("Entry deleted");
        location.hash = "#/" + routePrefix;
      }, "Delete");
    } else {
      const existing = await dbGet(store, id);
      existing.history = existing.history || [];
      existing.deleted = false;
      existing.history.push({ ts: nowISO(), action: "restored", changes: {} });
      await dbPut(store, existing);
      showToast("Entry restored");
      render();
    }
    return;
  }

  if (action === "delete-incident" || action === "delete-parenting") {
    const store = action === "delete-incident" ? "incidents" : "parentingTime";
    const id = Number(actionEl.dataset.id);
    confirmModal("Delete this entry?", "It will be hidden from the log but kept on record so you can restore it later.", async () => {
      const existing = await dbGet(store, id);
      existing.history = existing.history || [];
      existing.deleted = true;
      existing.deletedAt = nowISO();
      existing.history.push({ ts: nowISO(), action: "deleted", changes: {} });
      await dbPut(store, existing);
      showToast("Entry deleted");
      location.hash = store === "incidents" ? "#/incidents" : "#/parenting";
    }, "Delete");
    return;
  }

  if (action === "restore-incident" || action === "restore-parenting") {
    const store = action === "restore-incident" ? "incidents" : "parentingTime";
    const id = Number(actionEl.dataset.id);
    const existing = await dbGet(store, id);
    existing.history = existing.history || [];
    existing.deleted = false;
    existing.history.push({ ts: nowISO(), action: "restored", changes: {} });
    await dbPut(store, existing);
    showToast("Entry restored");
    render();
    return;
  }
}

async function onAppChange(e) {
  const t = e.target;

  if (t.id === "courtdocs-file-input" && t.files && t.files.length) {
    Array.from(t.files).forEach((file) => {
      courtDocsPendingAttachments.push({ name: file.name, type: file.type, size: file.size, blob: file });
    });
    t.value = "";
    renderAttachmentChips();
    return;
  }

  if (t.id === "import-file" && t.files && t.files[0]) {
    const file = t.files[0];
    try {
      const payload = JSON.parse(await file.text());
      confirmModal("Import backup?", "This will merge the backup into your existing data. Entries with matching IDs will be overwritten.", async () => {
        for (const inc of payload.incidents || []) await dbPut("incidents", inc);
        for (const p of payload.parentingTime || []) await dbPut("parentingTime", p);
        for (const f of payload.finance || []) await dbPut("finance", f);
        for (const c of payload.camper || []) await dbPut("camper", c);
        for (const s of payload.shop || []) await dbPut("shop", s);
        for (const cd of deserializeCourtDocsFromImport(payload.courtdocs)) await dbPut("courtdocs", cd);
        if (payload.settings) { const s = Object.assign({}, payload.settings, { key: "settings" }); await dbPut("settings", s); cachedSettings = s; }
        showToast("Backup imported");
        render();
      }, "Import");
    } catch (err) {
      showToast("Invalid backup file");
    }
    return;
  }

  const df = t.closest("[data-filter]");
  if (df) {
    const [scope, key] = df.dataset.filter.split(":");
    const value = t.type === "checkbox" ? t.checked : (t.value || null);
    if (scope === "summary") summaryState[key === "from" ? "customFrom" : "customTo"] = value;
    else {
      const obj = getFilterObj(scope);
      if (obj) obj[key] = value;
    }
    render();
    return;
  }
}

async function onAppSubmit(e) {
  e.preventDefault();
  const form = e.target;
  const type = form.dataset.form;
  if (type === "incident") return submitIncidentForm(form);
  if (type === "parenting") return submitParentingForm(form);
  if (type === "finance") return submitFinanceForm(form);
  if (type === "camper") return camperLog.submitForm(form);
  if (type === "shop") return shopLog.submitForm(form);
  if (type === "courtdocs") return submitCourtDocsForm(form);
  if (type === "settings") return submitSettingsForm(form);
}

/* ---------------------------- Init ---------------------------- */

window.addEventListener("hashchange", render);

async function init() {
  const app = document.getElementById("app");
  app.addEventListener("click", onAppClick);
  app.addEventListener("change", onAppChange);
  app.addEventListener("submit", onAppSubmit);

  try {
    await openDatabase();
  } catch (err) {
    app.innerHTML = `<div class="empty-state"><p>This browser blocked local storage, so the app can't save data here. Try turning off private/incognito mode.</p></div>`;
    return;
  }
  await loadSettings();

  if (!location.hash) location.hash = "#/logs";
  else render();
}

document.addEventListener("DOMContentLoaded", init);
</script>
